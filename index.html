<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1% Club">
<meta name="description" content="Czy Twój mózg jest w top 1%? 30 poziomów zagadek z pamięci, logiki, refleksu i percepcji.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23ffd23f'/%3E%3Ctext x='20' y='26' text-anchor='middle' font-family='Arial Black,sans-serif' font-weight='900' font-size='14' fill='%231d1600'%3E1%25%3C/text%3E%3C/svg%3E">
<title>1% Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; home is a stack of cards, the game is a full-height stage with a 30-rung ladder on top.
   Single deliberate dark look (night-show studio): ink black, warm paper panels for puzzles, signal yellow accent. */
:root{
  color-scheme:dark;
  --bg:#0b0b0d; --surface:#16161b; --surface2:#202027; --line:#2c2c35;
  --fg:#f4f2ea; --muted:#9b98a6; --accent:#ffd23f; --accent-ink:#1d1600;
  --paper:#f3efe3; --paper-ink:#17161a; --paper-line:#d9d2bf;
  --good:#3fdc7c; --bad:#ff5a4e; --violet:#8b7cf6;
  --c-red:#ff4d4d; --c-blue:#3d8bff; --c-green:#2fd16b; --c-yellow:#ffd23f; --c-violet:#b18cff; --c-orange:#ff8a1f;
  --font-d:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html:has(body.ingame){overflow:hidden}
body.ingame{overflow:hidden;position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,.linkbox{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;position:relative}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .28s ease both}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;padding:0 18px;font-weight:800;font-size:16px;transition:transform .12s, filter .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.line{border:1.5px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon{width:20px;height:20px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:13px}

/* top bar */
.topbar{display:flex;align-items:center;gap:8px;padding-top:4px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:800;font-size:18px}
.logo svg{width:34px;height:34px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}

/* hero */
.hero{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h1{font-size:34px;color:var(--accent);font-weight:800;line-height:1}
.tag{font-size:11px;font-weight:800;letter-spacing:.12em;color:#ff9a62;background:#3a1d12;border-radius:999px;padding:6px 12px}
.preview{background:var(--paper);border-radius:18px;height:170px;position:relative;overflow:hidden;color:var(--paper-ink)}
.preview svg{width:100%;height:100%;display:block}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bigpct{font-family:var(--font-d);font-size:34px;color:var(--accent);font-weight:800;line-height:1}
.brain{width:48px;height:40px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--accent)}

.daily .dots{display:flex;gap:6px}
.dot{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13px}
.dot.ok{background:var(--accent);color:var(--accent-ink)}
.dot.no{background:#3a1715;color:var(--bad)}
.dot.star{border:1.5px dashed var(--line)}
.dot.star.ok{border:0}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--surface);border-radius:var(--r);padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.cat .art{border-radius:12px;aspect-ratio:16/10;overflow:hidden;max-width:100%}
.cat .art svg{width:100%;height:100%;display:block}
.cat b{font-family:var(--font-d);font-size:15px;padding:0 4px}
.cat span{font-size:12.5px;color:var(--muted);padding:0 4px;margin-top:-6px}

.tiles3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tilebtn{background:var(--surface);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px;text-align:center}
.tilebtn svg{width:26px;height:26px;color:var(--accent)}
.code{display:flex;gap:8px}
.code input{flex:1;min-width:0;background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;color:var(--fg);min-height:44px;font-family:var(--font-m);font-size:13px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}

/* game */
body.ingame #app{height:100%;min-height:0;padding-block:8px}
.game{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.gtop{display:flex;align-items:center;gap:8px}
.glvl{font-family:var(--font-d);font-weight:800;font-size:16px}
.gpct{font-family:var(--font-m);font-weight:700;color:var(--accent);font-size:13px;background:var(--surface2);padding:6px 10px;border-radius:999px}
.ladder{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.ladder i{height:6px;border-radius:2px;background:var(--surface2)}
.ladder i.done{background:var(--accent)}
.ladder i.cur{background:var(--fg);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.gtitle{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.gtitle .cdot{width:8px;height:8px;border-radius:50%}
.ginstr{font-family:var(--font-d);font-size:19px;font-weight:600;line-height:1.25;min-height:48px}
.ginstr b{color:var(--accent)}
.ginstr.flash{animation:flash .7s ease}
@keyframes flash{0%{transform:scale(1.08);color:var(--accent)}30%{transform:translateX(-6px)}50%{transform:translateX(6px)}100%{transform:none}}
.timer{display:flex;align-items:center;gap:10px}
.timer svg{width:26px;height:26px;color:var(--violet)}
.tbar{flex:1;height:14px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1.5px solid var(--line)}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--violet),#b4a9ff);transform-origin:left;border-radius:99px}
.timer.low .tbar i{background:var(--bad)}
.timer .num{width:44px;text-align:right;font-weight:700}
.stage{flex:1;border-radius:22px;background:var(--paper);color:var(--paper-ink);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;min-height:0;overflow:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation;justify-content:safe center}
.stage.void{background:#050506;color:var(--fg)}
.stage.ok{box-shadow:inset 0 0 0 4px var(--good)}
.stage.no{box-shadow:inset 0 0 0 4px var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stage .hint{font-size:13px;font-weight:700;color:#6f6a5c;text-align:center}
.stage.void .hint{color:var(--muted)}

/* puzzle bits */
.tiles{display:grid;gap:10px;width:min(100%,320px,42dvh)}
.tiles.g3{grid-template-columns:repeat(3,1fr)}
.tiles.g4{grid-template-columns:repeat(4,1fr)}
.tiles.g5{grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:14px;background:#fff;border:2.5px solid var(--paper-ink);transition:background .12s, transform .1s}
.tile.lit{background:var(--accent);transform:scale(1.05)}
.tile.blk,.tile.on{background:var(--paper-ink)}
.tile.tap{transform:scale(.92)}
.tile.wrong{background:var(--bad)}
.tile.miss{background:repeating-linear-gradient(45deg,#fff,#fff 5px,#ffb3ad 5px,#ffb3ad 10px)}
.optgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(100%,360px)}
.opt{background:#fff;border:2.5px solid var(--paper-ink);border-radius:16px;padding:8px;display:grid;place-items:center;min-height:64px;font-family:var(--font-m);font-weight:700;font-size:20px;color:var(--paper-ink);transition:transform .1s}
.opt:active{transform:scale(.95)}
.opt svg{width:100%;max-width:min(78px,10dvh);height:auto;aspect-ratio:1}
.opt.right{background:var(--good)}
.opt.wrongpick{background:var(--bad);color:#fff}
.void .opt{background:var(--surface2);border-color:var(--line);color:var(--fg)}
.figbig{width:min(62%,220px,30dvh);aspect-ratio:1}
.ring{width:56px;height:56px}
.mask{width:min(80%,260px);aspect-ratio:1;border-radius:20px;background:repeating-conic-gradient(var(--paper-ink) 0 25%,#fff 0 50%) 0 0/24px 24px;opacity:.9;animation:spin 1.2s linear infinite}
@keyframes spin{to{background-position:24px 24px}}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--paper-ink);width:min(100%,290px,31dvh);background:#fffaf0;flex:none}
.matrix>div{aspect-ratio:1;border:1px solid var(--paper-line);display:grid;place-items:center;padding:6px}
.matrix svg{width:100%;height:100%}
.matrix .q{font-family:var(--font-d);font-size:34px;color:#a39d8a}
.series{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.series div{min-width:52px;height:56px;padding:0 8px;border-radius:12px;background:#fff;border:2.5px solid var(--paper-ink);display:grid;place-items:center;font-family:var(--font-m);font-weight:700;font-size:20px}
.series .q{background:var(--accent)}
.qtext{font-size:19px;font-weight:700;line-height:1.4;text-align:center;max-width:36ch;text-wrap:pretty}
.digits{font-family:var(--font-m);font-weight:700;font-size:clamp(28px,9vw,44px);letter-spacing:.08em;text-align:center;word-break:break-all}
.slots{font-family:var(--font-m);font-weight:700;font-size:26px;letter-spacing:.12em;min-height:40px;text-align:center;word-break:break-all}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,300px)}
.keypad button{min-height:min(54px,7dvh);border-radius:14px;background:#fff;border:2px solid var(--paper-ink);font-family:var(--font-m);font-weight:700;font-size:22px;color:var(--paper-ink)}
.keypad button.ok{background:var(--paper-ink);color:var(--accent);font-family:var(--font-b);font-size:16px}
.react{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.react .blob{width:120px;height:120px;border-radius:50%;background:#2a2a31;transition:background .05s}
.react.go .blob{background:var(--accent);box-shadow:0 0 60px rgba(255,210,63,.5)}
.react .times{position:absolute;right:18px;top:18px;text-align:right;font-family:var(--font-m);font-size:13px;color:var(--muted);line-height:1.7}
.react .times b{color:var(--fg)}
.react .msg{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-weight:700;color:var(--muted)}
.target{position:absolute;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(255,210,63,.18);animation:pop .15s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}}
.stim{width:130px;height:130px;animation:pop2 .12s ease-out}
@keyframes pop2{from{transform:scale(.4)}}
.shade{display:grid;gap:6px;width:min(100%,330px,50dvh)}
.shade button{aspect-ratio:1;border-radius:10px}
.glyphs{display:grid;gap:2px;width:min(100%,50dvh)}
.glyphs button{aspect-ratio:1;font-family:var(--font-m);font-weight:500;color:var(--paper-ink);border-radius:6px;display:grid;place-items:center;padding:0;line-height:1}
.glyphs button:active{background:#e6dfcb}
.dotsgrid{display:grid;gap:10px;width:min(100%,330px,44dvh)}
.dotsgrid button{aspect-ratio:1;border-radius:50%;position:relative;transition:transform .2s}
.dotsgrid button.done{transform:scale(.6);opacity:.35}
.dotsgrid button.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.stroopword{font-family:var(--font-d);font-weight:800;font-size:clamp(30px,10vw,46px);letter-spacing:.02em}
.rule{font-size:12px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--surface2);color:var(--fg)}
.rule.alt{background:var(--accent);color:var(--accent-ink)}
.stroopbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stroopbtns button{min-height:54px;border-radius:14px;background:var(--surface2);font-weight:800;font-size:15px;letter-spacing:.04em}
.field{position:relative;width:min(100%,360px,40dvh);aspect-ratio:8/7;flex:none;background:#fffaf0;border:2px solid var(--paper-ink);border-radius:14px}
.field svg{width:100%;height:100%}
.progressdots{display:flex;gap:5px;justify-content:center}
.progressdots i{width:8px;height:8px;border-radius:50%;background:#3a3a44}
.progressdots i.on{background:var(--accent)}
.stage:not(.void) .progressdots i{background:#d4ccb6}
.stage:not(.void) .progressdots i.on{background:var(--paper-ink)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,5,7,.86);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,440px);max-height:100%;overflow:auto;background:var(--surface);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:center;animation:rise .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.sheet .big{font-family:var(--font-d);font-weight:800;font-size:22px}
.megapct{font-family:var(--font-d);font-weight:800;font-size:76px;line-height:.95;color:var(--accent);letter-spacing:-.03em}
.megapct small{font-size:.45em}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 6px}
.stat b{display:block;font-family:var(--font-m);font-size:18px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.btncol{display:flex;flex-direction:column;gap:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.intro{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.intro .lv{font-family:var(--font-d);font-weight:800;font-size:58px;line-height:1}
.intro .art{width:min(100%,260px);aspect-ratio:16/10;border-radius:16px;overflow:hidden}
.intro .art svg{width:100%;height:100%;display:block}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs .side{background:var(--surface2);border-radius:16px;padding:12px 8px}
.vs .side.win{box-shadow:inset 0 0 0 2px var(--accent)}
.vs .side b{display:block;font-family:var(--font-d);font-size:26px;color:var(--accent)}
.vs .side .nm{font-weight:800;overflow-wrap:anywhere}
.vs .mid{font-family:var(--font-d);font-weight:800;color:var(--muted)}
.linkbox{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px;font-family:var(--font-m);font-size:12px;word-break:break-all;text-align:left;user-select:all;-webkit-user-select:all}
.shareimg{width:100%;border-radius:16px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:90;animation:rise .25s;max-width:90%}

/* lists */
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px}
.lrow.me{box-shadow:inset 0 0 0 2px var(--accent)}
.lrow .rk{font-family:var(--font-m);font-weight:700;color:var(--muted);text-align:center}
.lrow .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sc{font-family:var(--font-m);font-weight:700;text-align:right}
.lrow .sc small{display:block;color:var(--muted);font-size:11px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);padding:4px;border-radius:14px}
.tabs button{min-height:40px;border-radius:10px;font-weight:800;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface2);color:var(--fg)}
.dchal{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px}
.dchal .ic{width:52px;height:52px;border-radius:12px;overflow:hidden}
.dchal .ic svg{width:100%;height:100%}
.dchal b{font-family:var(--font-d);font-size:14px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge .medal{width:54px;height:54px}
.badge b{font-size:12.5px}
.badge span{font-size:11px;color:var(--muted);line-height:1.3}
.badge.off{opacity:.38;filter:grayscale(1)}
.field-in{display:flex;flex-direction:column;gap:6px;text-align:left}
.field-in input{background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;color:var(--fg)}
.readcard{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;width:100%;max-width:340px;animation:in .25s ease both}

<script>
'use strict';
/* =========================================================
   1% CLUB — prototyp webowy
   Wszystkie zagadki są generowane deterministycznie z ziarna

   ========================================================= */
const PUBLIC_URL = 'https://claude.ai/artifact/Fx4EbzcJ1xnezqSifC6uTC'; // uzupełniane po publikacji (link do gry)

/* ---------- RNG ---------- */
function hashStr(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return ((h2 ^ h1) >>> 0);
}
function RNG(seed) {
  let a = seed >>> 0;
  const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.int = n => Math.floor(f() * n);
  f.range = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.shuffle = arr => { arr = arr.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return f;
}
const range = n => Array.from({ length: n }, (_, i) => i);
const newSeed = () => Math.random().toString(36).slice(2, 10);

/* ---------- dane gry ---------- */
// % graczy, którzy PRZESZLI dany poziom (symulowane)

const fmtPct = v => (v % 1 ? v.toFixed(1).replace('.', ',') : String(v));
const MODES = {
  easy: { label: 'Łatwy', desc: 'Więcej czasu na każdą zagadkę. Wynik ×0,7.', time: 1.5, react: 90, mult: 0.7, code: 'e' },
  normal: { label: 'Normalny', desc: 'Standardowe limity czasu. Wynik ×1.', time: 1, react: 0, mult: 1, code: 'n' },
  expert: { label: 'Ekspert', desc: 'Mniej czasu, ostrzejsze progi refleksu. Wynik ×1,5.', time: 0.72, react: -30, mult: 1.5, code: 'x' }
};
const MODE_BY_CODE = { e: 'easy', n: 'normal', x: 'expert' };
const CATS = {

  log: { name: 'Logika', sub: 'Rozwiąż problem', color: '#8b7cf6' },

/* ---------- stan ---------- */
const KEY = 'onepct-club-v1';
const defState = () => ({ name: '', mode: 'normal', sound: true, xp: 0, games: 0, best: { level: 0, score: 0 }, bestBy: { easy: 0, normal: 0, expert: 0 }, today: { date: '', level: 0, score: 0 }, streak: { count: 0, last: '', max: 0 }, daily: {}, history: [], badges: [], bestReact: 0,
  pid: '', avatar: 0, totalRun: 0, weekPts: {}, dayBest: {}, dailyPts: {}, catStats: {}, levelsPassed: 0, dailyDone: 0, trainBest: {}, outbox: [] });
let S = load();
function load() { try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); return Object.assign(defState(), r || {}); } catch (e) { return defState(); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dkey(new Date());

function markPlayed() {
  const t = today();
  if (S.streak.last === t) return;
  S.streak.count = S.streak.last === yesterday() ? S.streak.count + 1 : 1;
  S.streak.last = t; S.streak.max = Math.max(S.streak.max || 0, S.streak.count);

function streakNow() { return (S.streak.last === today() || S.streak.last === yesterday()) ? S.streak.count : 0; }
/* ---------- XP i poziom gracza ---------- */

const MAX_LV = 100;

  let lv = 1, base = 0;
  while (lv < MAX_LV && xp >= base + xpNeed(lv)) { base += xpNeed(lv); lv++; }

const XP_MODE = { easy: .6, normal: 1, expert: 1.6 };
// zwykła gra: 8 XP za poziom 1 … 54 XP za poziom 30; Ekspert ×1,6 i dodatkowo rośnie z poziomem (do 130 XP za poziom 30)
const xpRun = (l, mode) => Math.round((6 + 1.6 * l) * XP_MODE[mode] * (mode === 'expert' ? 1 + l / 60 : 1));

const xpTrain = l => Math.round(2 + .4 * l);

const xpDaily = (pts, lvl = 6) => pts ? Math.round((15 + pts / 18 + lvl) * (1 + Math.min(.5, streakNow() * .05))) : 3;
function weekKey(d = new Date()) { const m = new Date(d); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return dkey(m); }

/* ---------- wspólny ranking online (Supabase) ----------

const ONLINE = { url: 'https://nwjdppkpdaakrkeryrzh.supabase.co', key: 'sb_publishable_zlHiErYvCB81MVDuEewnJQ_pXSeF-Ae' };
const onlineOn = () => !!(ONLINE.url && ONLINE.key);
function sbFetch(path, body) {

}
let flushing = false;
async function flushOutbox() {
  if (!onlineOn() || flushing || !S.outbox.length) return;

function localBoard(board) {
  const t = today(), w = weekKey();

  if (!v.score) return { rows: [], me: null, total: 0 };
  const row = { player_id: playerId(), name: displayName(), points: v.score, level: v.lvl || S.best.level, games: 0 };

async function loadBoard(board) {
  if (!onlineOn()) return { ...localBoard(board), online: false };

  } catch (e) { }
}
const NOTES = [262, 294, 330, 349, 392, 440, 494, 523, 587, 659, 698, 784, 880, 988, 1047, 1175];
function sfx(n, i) {

  else if (n === 'note') tone(NOTES[i % 16], .18, 'triangle', .13);

  else if (n === 'bad') { tone(200, .3, 'sawtooth', .08); tone(150, .35, 'sawtooth', .07, .1); }
  else if (n === 'tick') tone(1300, .03, 'square', .04);
  else if (n === 'go') tone(880, .06, 'square', .06);

}

            st.innerHTML = `<span class="rule ${q.rule === 'word' ? 'alt' : ''}">${q.rule === 'word' ? 'SŁOWO' : 'KOLOR'}</span><div class="stroopword" style="color:${COL[q.ink]}">${COL_PL[q.w]}</div><div class="stroopbtns">${q.order.map((c, j) => `<button data-c="${c}" style="${l >= 20 ? `color:${COL[q.btnInk[j]]}` : ''}">${COL_PL[c]}</button>`).join('')}</div><div class="progressdots">${R.map((_, j) => `<i class="${j < k ? 'on' : ''}"></i>`).join('')}</div>`;
            const id = api.after(win, () => api.done(false, { msg: 'Za wolno!' }));
            $('.stroopbtns', st).addEventListener('click', e => {

  count: {
    cat: 'per', min: 6, gen(r, l) {

      const total = Math.min(50, 14 + l), cnt = r.range(3, 6 + Math.floor(l / 6));

      const cells = r.shuffle(range(56)).slice(0, total);
      const placed = r.shuffle(items).map((it, i) => ({ t: it[0], c: it[1], x: (cells[i] % 8) * 50 + 25 + r.range(-8, 8), y: Math.floor(cells[i] / 8) * 50 + 25 + r.range(-8, 8), rot: r.range(0, 359) }));
      const opts = numOptions(r, cnt, [cnt + 1, cnt - 1, cnt + 2, cnt - 2]);
      const colName = { yellow: 'ŻÓŁTYCH', red: 'CZERWONYCH', blue: 'NIEBIESKICH' }, typeName = { triangle: 'TRÓJKĄTÓW', circle: 'KÓŁ', square: 'KWADRATÓW' };
      return {
        title: 'Policz', instr: `Ile jest <b>${colName[tc]} ${typeName[tt]}</b>?`,
        render(st, api) {
          st.innerHTML = `<div class="field"><svg viewBox="0 0 400 350">${placed.map(p => `<g transform="rotate(${p.t === 'circle' ? 0 : p.rot} ${p.x} ${p.y})">${shp(p.t, p.x, p.y, 15, COL[p.c], 'stroke="#17161a" stroke-width="2"')}</g>`).join('')}</svg></div>`;
          optButtons(st, opts, cnt, api);

};
const TYPES_BY_CAT = c => Object.keys(PUZ).filter(k => PUZ[k].cat === c);

function catFor(seed, lvl) {
  const b = Math.floor((lvl - 1) / 4);
  return RNG(hashStr(seed + '|cats|' + b)).shuffle(['mem', 'log', 'ref', 'per'])[(lvl - 1) % 4];
}
function makePuzzle(seed, lvl, cat, attempt = 0, forceType) {
  const r = RNG(hashStr(seed + '|' + lvl + '|' + attempt));
  const types = Object.keys(PUZ).filter(k => PUZ[k].cat === cat && PUZ[k].min <= lvl);
  const type = forceType || r.pick(types);
  return { ...PUZ[type].gen(r, lvl), cat, type };
}

let cur = null;
function leaveGame() { killPuzzle(); document.body.classList.remove('ingame'); }
function killPuzzle() { if (cur) { cur.alive = false; cur.timers.forEach(clearTimeout); cancelAnimationFrame(cur.raf); cur = null; } }
function runPuzzle(p, mode, onDone) {
  killPuzzle();
  const ses = { alive: true, timers: [], raf: 0, t0: 0, dur: 0, frac: null, lastTick: 99 };
  cur = ses;
  const st = $('#g-stage'); st.innerHTML = ''; st.className = 'stage' + (p.dark ? ' void' : '');
  const fresh = st.cloneNode(false); st.replaceWith(fresh);
  const stage = fresh;
  $('#g-instr').innerHTML = p.instr; $('#g-instr').classList.remove('flash');
  $('#g-title').innerHTML = `<i class="cdot" style="background:${CATS[p.cat].color}"></i>${CATS[p.cat].name} · ${p.title}`;
  const tw = $('#g-timer'); tw.style.visibility = 'hidden'; tw.classList.remove('low');
  const bar = $('i', tw), num = $('.num', tw);
  const api = {
    mode,
    live: () => ses.alive,
    after(ms, fn) { const id = setTimeout(() => { if (ses.alive) fn(); }, ms); ses.timers.push(id); return id; },
    instr(t, flash) { const e = $('#g-instr'); e.innerHTML = t; if (flash) { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); } },
    timer(sec) {
      ses.dur = sec * MODES[mode].time * 1000; ses.t0 = performance.now(); tw.style.visibility = 'visible';
      const loop = () => {
        if (!ses.alive || !ses.dur) return;
        const left = Math.max(0, ses.dur - (performance.now() - ses.t0));
        bar.style.transform = `scaleX(${left / ses.dur})`; num.textContent = (left / 1000).toFixed(1);
        const s = Math.ceil(left / 1000); if (s <= 3 && s < ses.lastTick) { ses.lastTick = s; tw.classList.add('low'); if (s > 0) sfx('tick'); }
        if (left <= 0) { api.done(false, { msg: 'Koniec czasu!' }); return; }
        ses.raf = requestAnimationFrame(loop);
      };
      loop();
    },
    frac() { return ses.dur ? Math.max(0, 1 - (performance.now() - ses.t0) / ses.dur) : .5; },
    done(ok, info = {}) {
      if (!ses.alive) return;
      const frac = info.frac ?? api.frac();
      ses.alive = false; cancelAnimationFrame(ses.raf); ses.timers.forEach(clearTimeout);
      sfx(ok ? 'good' : 'bad'); stage.classList.add(ok ? 'ok' : 'no');
      const ms = ses.tPlay ? Math.round(performance.now() - ses.tPlay) : 0;
      setTimeout(() => { if (cur === ses) cur = null; onDone(ok, { ...info, frac, ms }); }, ok ? 550 : 900);
    }
  };
  // faza czytania polecenia: 2–5 s (zależnie od długości), potem start zadania i odliczania
  const plain = p.instr.replace(/<[^>]+>/g, '');
  const readMs = Math.round(Math.min(5000, Math.max(2000, 1200 + plain.length * 40)) * (mode === 'easy' ? 1.2 : 1));
  $('#g-instr').innerHTML = '<span class="muted">Przeczytaj polecenie…</span>';
  stage.innerHTML = `<div class="readcard"><div class="eyebrow">${CATS[p.cat].name} · ${p.title}</div><div class="rc-text">${p.instr}</div><div class="rc-count">${Math.ceil(readMs / 1000)}</div><div class="rc-bar"><i style="transition:transform ${readMs}ms linear"></i></div><button class="btn primary sm" type="button">Jestem gotowy</button></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const i = $('.rc-bar i', stage); if (i) i.style.transform = 'scaleX(0)'; }));
  let started = false;
  const begin = () => { if (started || !ses.alive) return; started = true; ses.tPlay = performance.now(); stage.innerHTML = ''; $('#g-instr').innerHTML = p.instr; p.render(stage, api); };
  $('.readcard button', stage).addEventListener('click', begin);
  const tStart = performance.now();
  for (let k = 1; k * 1000 < readMs; k++) api.after(k * 1000, () => { const c = $('.rc-count', stage); if (c && !started) { c.textContent = Math.ceil((readMs - (performance.now() - tStart)) / 1000); sfx('tick'); } });
  api.after(readMs, begin);
}

const toHex = s => [...new TextEncoder().encode(s.slice(0, 14))].map(b => b.toString(16).padStart(2, '0')).join('');
const fromHex = h => { try { return new TextDecoder().decode(new Uint8Array((h.match(/../g) || []).map(x => parseInt(x, 16)))); } catch (e) { return 'Znajomy'; } };
function makeToken(c) { return ['c', c.seed, MODES[c.mode].code, c.lvl, c.score.toString(36), toHex(S.name || 'Gracz')].join('-'); }
function parseToken(t) {

function medal(id, small) {

  return `<svg class="medal" style="width:${s}px;height:${s}px;flex:none" viewBox="0 0 54 54" aria-hidden="true"><polygon points="${range(8).map(k => { const a = k * Math.PI / 4 + Math.PI / 8; return `${27 + 25 * Math.cos(a)},${27 + 25 * Math.sin(a)}`; }).join(' ')}" fill="#ffd23f"/><circle cx="27" cy="27" r="18" fill="#1d1600"/><g transform="translate(15 15)" style="color:#ffd23f"><svg width="24" height="24" viewBox="0 0 24 24">${ICONS[BADGES[id].i]}</svg></g></svg>`;
}
function checkBadges(ctx) {
  const got = new Set(S.badges), add = [];
  const give = id => { if (!got.has(id)) { got.add(id); add.push(id); } };
  if (S.games >= 1) give('first');
  if (S.best.level >= 10) give('l10');
  if (S.best.level >= 20) give('l20');
  if (S.best.level >= 30) give('club');
  if (S.bestReact && S.bestReact < 280) give('fast');
  if (streakNow() >= 3) give('streak3');
  if (streakNow() >= 7) give('streak7');
  const ds = S.daily[today()]; if (ds && ds.r.every(v => v === true)) give('daily5'); if (ds && ds.bonus === true) give('bonus');
  if ((S.bestBy.expert || 0) >= 10) give('expert');
  if (ctx.challenge) give('duel');
  if (ctx.run && !ctx.usedLife && ctx.run.lvl >= 15 && !ctx.run.train) give('pure');
  S.badges = [...got];
  return add;
}

let homeAnim = 0;
function animatePreview() {
  clearInterval(homeAnim); let n = 8, k = 0;
  const pat = [[0, 4, 6], [1, 2, 7], [0, 3, 5], [2, 4, 7], [1, 5, 6]];
  homeAnim = setInterval(() => {
    const t = $('#pvn'); if (!t) return clearInterval(homeAnim);
    n = n <= 1 ? 8 : n - 1; t.textContent = n; k++;
    const on = pat[k % pat.length];
    $$('.pvt').forEach((r, i) => r.setAttribute('fill', on.includes(i) ? '#17161a' : '#fff'));
    $('#pvb').setAttribute('width', 12 + (8 - n) * 15);
  }, 900);
}

/* ---------- blokada zoomu: gra działa jak aplikacja ---------- */
(function lockZoom() {
  try {
    let m = document.querySelector('meta[name=viewport]');
    if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
    m.setAttribute('content', 'width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover');
  } catch (e) { }
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', '_'].includes(e.key)) e.preventDefault(); });
  document.addEventListener('dblclick', stop, { passive: false });
})();
